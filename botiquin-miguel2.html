<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fdf6f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Botiquín">
<meta name="description" content="Un botiquín de cariño, hecho con amor por Yeli.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🩹%3C/text%3E%3C/svg%3E">
<title>Botiquín de Yeli 🩹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fdf6f0;
  --bg2: #f5ede4;
  --white: #ffffff;
  --glass: rgba(255,255,255,0.78);
  --border: #eaddd4;
  --pink: #e8829a;
  --pink-deep: #d0607a;
  --pink-light: #f5b8c6;
  --pink-pale: #fef0f3;
  --peach: #f0a07a;
  --mint: #7ac4a8;
  --mint-deep: #5fb896;
  --mint-pale: #eef8f4;
  --lavender: #a890d8;
  --lavender-pale: #f3effc;
  --blue: #7ab0d8;
  --text: #3a2e2e;
  --text-soft: #5a4848;
  --muted: #a08878;
  --shadow: rgba(180,130,110,0.15);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --smooth: cubic-bezier(.22,1,.36,1);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  font-family: 'Quicksand', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body.modal-open { overflow:hidden; }

/* grain texture */
body::after {
  content:'';
  position:fixed; inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:1000;
}

/* ---- AMBIENT BACKGROUND ---- */
.ambient { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.blob {
  position:absolute; border-radius:50%;
  filter:blur(60px); opacity:0.55;
  animation: drift 22s ease-in-out infinite alternate;
}
.blob.b1 { width:340px; height:340px; background:#fbd3dd; top:-80px; left:-100px; }
.blob.b2 { width:300px; height:300px; background:#fde0cf; bottom:-60px; right:-90px; animation-delay:-7s; animation-duration:26s; }
.blob.b3 { width:260px; height:260px; background:#e4dbf7; top:40%; left:55%; animation-delay:-13s; animation-duration:30s; }
@keyframes drift {
  0%   { transform:translate(0,0) scale(1); }
  50%  { transform:translate(40px,30px) scale(1.12); }
  100% { transform:translate(-30px,50px) scale(0.95); }
}
.float-heart {
  position:absolute; bottom:-40px;
  font-size:var(--size,14px); opacity:0;
  animation: floatUp var(--dur,14s) linear infinite;
  animation-delay: var(--delay,0s);
}
@keyframes floatUp {
  0%   { transform:translate(0,0) rotate(0deg); opacity:0; }
  10%  { opacity:var(--op,0.35); }
  50%  { transform:translate(var(--sway,20px),-55vh) rotate(12deg); }
  90%  { opacity:var(--op,0.35); }
  100% { transform:translate(0,-110vh) rotate(-8deg); opacity:0; }
}

/* ---- INTRO ---- */
#intro {
  position:fixed; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:500; text-align:center; padding:32px;
  transition: opacity 0.8s var(--smooth), transform 0.8s var(--smooth), filter 0.8s var(--smooth);
}
#intro.out { opacity:0; transform:scale(1.06); filter:blur(8px); pointer-events:none; }
#intro > * { animation: fadeUp 0.9s var(--smooth) both; }
#intro > *:nth-child(1) { animation-delay:0.1s; }
#intro > *:nth-child(2) { animation-delay:0.3s; }
#intro > *:nth-child(3) { animation-delay:0.45s; }
#intro > *:nth-child(4) { animation-delay:0.6s; }
#intro > *:nth-child(5) { animation-delay:0.8s; }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}

.intro-badge {
  position:relative;
  width:132px; height:132px; margin-bottom:26px;
  display:flex; align-items:center; justify-content:center;
}
.intro-badge::before, .intro-badge::after {
  content:''; position:absolute; inset:0; border-radius:50%;
  background: radial-gradient(circle, rgba(232,130,154,0.22), transparent 70%);
  animation: pulseRing 3s ease-out infinite;
}
.intro-badge::after { animation-delay:1.5s; }
@keyframes pulseRing {
  0%   { transform:scale(0.7); opacity:0.9; }
  100% { transform:scale(1.5); opacity:0; }
}
.intro-bag {
  position:relative;
  width:104px; height:104px; border-radius:50%;
  background:var(--glass);
  border:1.5px solid rgba(255,255,255,0.9);
  box-shadow:0 12px 40px rgba(232,130,154,0.25), inset 0 -6px 16px rgba(232,130,154,0.08);
  display:flex; align-items:center; justify-content:center;
  font-size:3.4rem;
  animation: wiggle 3s ease-in-out infinite;
}
@keyframes wiggle {
  0%,100% { transform:rotate(-4deg) translateY(0); }
  50%     { transform:rotate(4deg) translateY(-6px); }
}
.intro-eyebrow {
  font-size:0.72rem; font-weight:700; letter-spacing:0.22em;
  text-transform:uppercase; color:var(--muted); margin-bottom:10px;
}
#intro h1 {
  font-family:'Playfair Display',serif; font-weight:500;
  font-size:clamp(2.2rem,8vw,2.9rem); line-height:1.1;
  background: linear-gradient(135deg, var(--pink) 0%, var(--peach) 60%, var(--lavender) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:14px;
}
#intro h1 em { font-style:italic; }
#intro p {
  color:var(--muted); font-size:0.95rem; font-weight:500;
  line-height:1.75; margin-bottom:32px; max-width:280px;
}

.open-btn {
  position:relative; overflow:hidden;
  padding:15px 40px;
  background: linear-gradient(135deg, var(--pink), var(--peach));
  color:white; border:none; border-radius:50px;
  font-family:'Quicksand',sans-serif; font-size:1rem; font-weight:700; letter-spacing:0.02em;
  cursor:pointer; box-shadow:0 8px 28px rgba(232,130,154,0.4);
  transition:transform 0.3s var(--spring), box-shadow 0.3s;
}
.open-btn::after {
  content:''; position:absolute; top:0; left:-60%;
  width:40%; height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
  transform:skewX(-20deg);
  animation: shimmer 3.2s ease-in-out infinite 1.5s;
}
@keyframes shimmer { 0%{left:-60%} 40%,100%{left:130%} }
.open-btn:hover { transform:translateY(-3px); box-shadow:0 12px 34px rgba(232,130,154,0.5); }
.open-btn:active { transform:scale(0.96); }

.intro-sign {
  margin-top:26px;
  font-family:'Playfair Display',serif; font-style:italic;
  font-size:0.9rem; color:var(--pink-light);
}

/* ---- MAIN ---- */
#main {
  position:relative; z-index:1;
  display:none;
  padding:calc(36px + env(safe-area-inset-top)) 18px calc(56px + env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto;
}
#main.show .reveal { animation: fadeUp 0.8s var(--smooth) both; }
#main.show .reveal:nth-child(1) { animation-delay:0.05s; }
#main.show .reveal:nth-child(2) { animation-delay:0.15s; }
#main.show .reveal:nth-child(3) { animation-delay:0.25s; }
#main.show .reveal:nth-child(4) { animation-delay:0.35s; }
#main.show .reveal:nth-child(5) { animation-delay:0.45s; }
#main:not(.show) .reveal { opacity:0; }

.main-header { text-align:center; margin-bottom:30px; }
.greeting {
  display:inline-block;
  font-size:0.78rem; font-weight:700; color:var(--pink);
  background:var(--glass); border:1px solid rgba(255,255,255,0.9);
  padding:6px 14px; border-radius:50px; margin-bottom:14px;
  box-shadow:0 4px 14px var(--shadow);
}
.main-header h1 {
  font-family:'Playfair Display',serif; font-weight:500;
  font-size:2rem; line-height:1.15;
  background: linear-gradient(135deg, var(--pink), var(--peach));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:6px;
}
.main-header p { font-size:0.88rem; color:var(--muted); font-weight:500; }

.ornament {
  display:flex; align-items:center; justify-content:center; gap:10px;
  color:var(--pink-light); font-size:0.75rem; margin:16px 0 18px;
}
.ornament::before, .ornament::after {
  content:''; height:1px; width:52px;
  background:linear-gradient(90deg, transparent, var(--pink-light), transparent);
}

.header-actions { display:flex; flex-direction:column; align-items:center; gap:14px; }
.surprise-btn {
  position:relative; overflow:hidden;
  padding:11px 26px;
  background:var(--glass); color:var(--pink-deep);
  border:1.5px solid var(--pink-light); border-radius:50px;
  font-family:'Quicksand',sans-serif; font-size:0.88rem; font-weight:700;
  cursor:pointer; transition:transform 0.3s var(--spring), background 0.2s, box-shadow 0.3s;
  box-shadow:0 4px 16px rgba(232,130,154,0.15);
}
.surprise-btn:hover { background:var(--pink-pale); transform:translateY(-2px); box-shadow:0 8px 22px rgba(232,130,154,0.25); }
.surprise-btn:active { transform:scale(0.95); }
.surprise-btn .gift { display:inline-block; transition:transform 0.4s var(--spring); }
.surprise-btn:hover .gift { transform:rotate(-14deg) scale(1.2); }

.progress { width:100%; max-width:230px; }
.progress-track {
  height:6px; border-radius:6px; overflow:hidden;
  background:rgba(234,221,212,0.7);
}
.progress-fill {
  height:100%; width:0%; border-radius:6px;
  background:linear-gradient(90deg, var(--pink), var(--peach), var(--lavender));
  background-size:200% 100%;
  animation: flow 4s linear infinite;
  transition:width 0.9s var(--smooth);
}
@keyframes flow { to { background-position:-200% 0; } }
.progress-note { margin-top:8px; font-size:0.76rem; color:var(--muted); font-weight:500; }

/* ---- SHELF / GRID ---- */
.shelf {
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:14px;
}

/* ---- REMEDY ITEM ---- */
.remedy {
  font:inherit; text-align:left; width:100%;
  background:var(--glass);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,0.95);
  border-radius:22px;
  padding:20px 16px 16px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 16px var(--shadow), inset 0 0 0 1px rgba(234,221,212,0.5);
  transition:transform 0.35s var(--spring), box-shadow 0.35s;
}
#main:not(.show) .remedy { opacity:0; }
#main.show .remedy { animation: cardIn 0.7s var(--spring) backwards; }
@keyframes cardIn {
  from { opacity:0; transform:translateY(24px) scale(0.94); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}
.remedy:hover {
  transform:translateY(-5px);
  box-shadow:0 14px 32px var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--item-color) 35%, transparent);
}
.remedy:active { transform:scale(0.96); transition-duration:0.12s; }
.remedy.opened {
  box-shadow: 0 8px 26px var(--shadow), inset 0 0 0 2px color-mix(in srgb, var(--item-color) 55%, transparent);
}

/* color stripe top */
.remedy::before {
  content:'';
  position:absolute; top:0; left:0; right:0;
  height:4px;
  background: linear-gradient(90deg, var(--item-color), color-mix(in srgb, var(--item-color) 50%, white));
}
/* soft color glow in the corner */
.remedy .glow {
  position:absolute; width:120px; height:120px; border-radius:50%;
  top:-50px; right:-50px;
  background:radial-gradient(circle, color-mix(in srgb, var(--item-color) 22%, transparent), transparent 70%);
  transition:transform 0.5s var(--smooth);
  pointer-events:none;
}
.remedy:hover .glow { transform:scale(1.5); }
/* shine sweep on hover */
.remedy .shine {
  position:absolute; top:0; left:-75%; width:50%; height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,0.7), transparent);
  transform:skewX(-20deg);
  pointer-events:none;
}
.remedy:hover .shine { left:130%; transition:left 0.8s var(--smooth); }

.remedy-icon {
  position:relative;
  width:50px; height:50px; border-radius:16px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.75rem;
  background:color-mix(in srgb, var(--item-color) 12%, white);
  margin-bottom:12px;
  transition:transform 0.45s var(--spring);
}
.remedy:hover .remedy-icon, .remedy.opened .remedy-icon {
  transform:scale(1.1) rotate(-6deg);
}

.remedy-label {
  position:relative;
  font-size:0.66rem;
  font-weight:700;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color: var(--item-color, var(--pink));
  margin-bottom:4px;
}
.remedy-name {
  position:relative;
  font-family:'Playfair Display',serif; font-weight:500;
  font-size:1.02rem;
  color:var(--text);
  line-height:1.3;
}

/* tag/pill badge */
.remedy-badge {
  position:relative;
  display:inline-block;
  margin-top:10px;
  padding:3px 10px;
  border-radius:50px;
  font-size:0.68rem;
  font-weight:700;
  background: color-mix(in srgb, var(--item-color) 12%, white);
  color: color-mix(in srgb, var(--item-color) 80%, black);
  border:1px solid color-mix(in srgb, var(--item-color) 25%, transparent);
}

/* dot for remedies not opened yet */
.remedy .dot {
  position:absolute; top:16px; right:16px;
  width:9px; height:9px; border-radius:50%;
  background:var(--item-color, var(--pink));
  transition:transform 0.3s var(--spring), opacity 0.3s;
}
.remedy .dot::after {
  content:''; position:absolute; inset:0; border-radius:50%;
  background:var(--item-color);
  animation: ping 2s ease-out infinite;
}
@keyframes ping { 0%{transform:scale(1);opacity:0.6} 100%{transform:scale(2.8);opacity:0} }
.remedy:not(.unseen) .dot { transform:scale(0); opacity:0; }

.footer-note {
  text-align:center; margin-top:40px;
  font-family:'Playfair Display',serif; font-style:italic;
  color:var(--muted); font-size:0.95rem; line-height:1.7;
}
.footer-note .heart { display:inline-block; animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.25)} 30%{transform:scale(1)} 45%{transform:scale(1.18)} }
.footer-note small {
  display:block; margin-top:6px;
  font-family:'Quicksand',sans-serif; font-style:normal;
  font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--pink-light);
}

/* focus */
button:focus-visible, input:focus-visible {
  outline:3px solid var(--pink-light); outline-offset:3px;
}

/* ---- MODAL ---- */
#modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(60,30,30,0.32);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  z-index:300;
  align-items:flex-end; justify-content:center;
  padding:0 10px calc(10px + env(safe-area-inset-bottom));
}
#modal-overlay.show { display:flex; animation: overlayIn 0.35s ease both; }
#modal-overlay.closing { animation: overlayOut 0.3s ease both; }
@keyframes overlayIn  { from{opacity:0} to{opacity:1} }
@keyframes overlayOut { from{opacity:1} to{opacity:0} }

.modal {
  background:var(--white);
  border-radius:30px 30px 24px 24px;
  width:100%; max-width:470px;
  padding:14px 26px 32px;
  position:relative;
  box-shadow:0 -6px 50px rgba(60,30,30,0.18);
  max-height:88vh;
  overflow-y:auto;
  overscroll-behavior:contain;
}
#modal-overlay.show .modal { animation: sheetIn 0.55s var(--spring) both; }
#modal-overlay.closing .modal { animation: sheetOut 0.3s var(--smooth) both; }
@keyframes sheetIn  { from{transform:translateY(110%)} to{transform:translateY(0)} }
@keyframes sheetOut { from{transform:translateY(0);opacity:1} to{transform:translateY(60%);opacity:0} }

/* tinted header area */
.modal::before {
  content:''; position:absolute; top:0; left:0; right:0; height:170px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--modal-color, var(--pink)) 14%, white), transparent);
  pointer-events:none;
}
.modal > * { position:relative; }

.modal-handle {
  width:42px; height:5px; border-radius:5px;
  background:color-mix(in srgb, var(--modal-color, var(--pink)) 35%, white);
  margin:0 auto 14px;
}
.modal-close {
  position:absolute; top:16px; right:18px;
  background:rgba(255,255,255,0.85); border:1px solid var(--border); border-radius:50%;
  width:34px; height:34px; font-size:0.95rem;
  cursor:pointer; color:var(--muted);
  display:flex; align-items:center; justify-content:center;
  transition:transform 0.3s var(--spring), background 0.2s;
  z-index:2;
}
.modal-close:hover { background:var(--bg2); transform:rotate(90deg); }

.modal-icon {
  width:76px; height:76px; margin:4px auto 14px; border-radius:24px;
  display:flex; align-items:center; justify-content:center;
  font-size:2.6rem;
  background:white;
  box-shadow:0 8px 24px color-mix(in srgb, var(--modal-color, var(--pink)) 30%, transparent);
}
#modal-overlay.show .modal-icon { animation: iconPop 0.7s var(--spring) 0.15s both; }
@keyframes iconPop {
  0%   { transform:scale(0.3) rotate(-20deg); opacity:0; }
  100% { transform:scale(1) rotate(0); opacity:1; }
}
.modal-tag {
  text-align:center; margin-bottom:6px;
  font-size:0.68rem; font-weight:700; letter-spacing:0.16em;
  text-transform:uppercase; color:var(--modal-color,var(--pink));
}
.modal-title {
  font-family:'Playfair Display',serif; font-weight:500;
  font-size:1.5rem; color:var(--text); line-height:1.25;
  text-align:center; margin-bottom:22px;
}
#modal-overlay.show .modal-tag   { animation: fadeUp 0.6s var(--smooth) 0.22s both; }
#modal-overlay.show .modal-title { animation: fadeUp 0.6s var(--smooth) 0.28s both; }
#modal-overlay.show .modal-body > * { animation: fadeUp 0.6s var(--smooth) backwards; }
#modal-overlay.show .modal-body > *:nth-child(1) { animation-delay:0.34s; }
#modal-overlay.show .modal-body > *:nth-child(2) { animation-delay:0.42s; }
#modal-overlay.show .modal-body > *:nth-child(3) { animation-delay:0.50s; }
#modal-overlay.show .modal-body > *:nth-child(4) { animation-delay:0.58s; }
#modal-overlay.show .modal-body > *:nth-child(5) { animation-delay:0.66s; }
#modal-overlay.show .modal-body > *:nth-child(n+6) { animation-delay:0.74s; }

.modal-body {
  font-size:0.95rem; color:var(--text-soft);
  line-height:1.85; font-weight:500;
}
.modal-body p { margin-bottom:12px; }
.modal-body p:last-child { margin-bottom:0; }
.modal-body em { color:var(--modal-color,var(--pink)); font-style:normal; font-weight:700; }
.modal-body blockquote {
  position:relative;
  background:color-mix(in srgb, var(--modal-color,var(--pink)) 8%, white);
  border-radius:18px;
  padding:20px 18px 16px 22px;
  margin:18px 0;
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:1.04rem;
  color:var(--text);
  line-height:1.65;
}
.modal-body blockquote::before {
  content:'“'; position:absolute; top:-14px; left:12px;
  font-family:'Playfair Display',serif; font-style:normal;
  font-size:3.4rem; line-height:1;
  color:color-mix(in srgb, var(--modal-color,var(--pink)) 60%, white);
}
.modal-body .signature {
  text-align:right; margin-top:18px;
  font-family:'Playfair Display',serif; font-style:italic;
  font-size:1.05rem; color:var(--modal-color,var(--pink));
}

/* ---- BREATH WIDGET ---- */
.breath-widget {
  text-align:center; margin:18px 0 4px; padding:22px 12px 18px;
  background:var(--mint-pale); border-radius:22px;
}
.breath-stage {
  position:relative; width:150px; height:150px; margin:0 auto 14px;
  display:flex; align-items:center; justify-content:center;
}
.breath-halo {
  position:absolute; width:76px; height:76px; border-radius:50%;
  background:radial-gradient(circle, rgba(122,196,168,0.35), transparent 70%);
  transition:transform 0.1s linear;
}
.breath-ring {
  width:76px; height:76px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #c9ecdf, var(--mint) 75%);
  box-shadow:0 8px 26px rgba(122,196,168,0.45), inset 0 -4px 12px rgba(0,0,0,0.06);
  transition:transform 0.1s linear;
}
.breath-phase {
  font-family:'Playfair Display',serif;
  font-style:italic; font-size:1.15rem;
  color:var(--mint-deep); margin-bottom:10px; min-height:28px;
}
.breath-phase.swap { animation: fadeUp 0.5s var(--smooth); }
.breath-track {
  width:140px; height:4px; background:rgba(122,196,168,0.2);
  border-radius:4px; margin:0 auto 16px; overflow:hidden;
}
.breath-fill { height:100%; background:var(--mint); width:0%; transition:width 0.1s linear; border-radius:4px; }
.breath-start, .breath-stop {
  padding:9px 22px; border-radius:50px; border:none;
  font-family:'Quicksand',sans-serif; font-size:0.84rem; font-weight:700;
  cursor:pointer; transition:transform 0.3s var(--spring), background 0.2s;
}
.breath-start { background:var(--mint); color:white; box-shadow:0 6px 18px rgba(122,196,168,0.35); }
.breath-start:hover { background:var(--mint-deep); transform:translateY(-2px); }
.breath-stop { background:white; color:var(--muted); margin-left:6px; }
.breath-stop:hover { transform:translateY(-2px); }
.breath-count { font-size:0.78rem; color:var(--mint-deep); margin-top:12px; min-height:20px; font-weight:600; }

/* ---- JAR ---- */
.jar-inside {
  margin-top:18px; padding:18px 16px;
  background:color-mix(in srgb, var(--peach) 9%, white);
  border-radius:22px;
}
.jar-row { display:flex; gap:8px; margin:12px 0; }
.jar-input {
  flex:1; min-width:0; padding:11px 16px; border:1.5px solid var(--border);
  border-radius:50px; font-family:'Quicksand',sans-serif; font-weight:500;
  font-size:0.88rem; background:white; color:var(--text); outline:none;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.jar-input:focus { border-color:var(--peach); box-shadow:0 0 0 4px rgba(240,160,122,0.15); }
.jar-save {
  padding:11px 18px; background:linear-gradient(135deg, var(--peach), var(--pink)); color:white;
  border:none; border-radius:50px; font-family:'Quicksand',sans-serif;
  font-size:0.84rem; font-weight:700; cursor:pointer;
  transition:transform 0.3s var(--spring), box-shadow 0.3s;
  white-space:nowrap; box-shadow:0 6px 16px rgba(240,160,122,0.3);
}
.jar-save:hover { transform:translateY(-2px); }
.jar-save:active { transform:scale(0.95); }
.jar-tags { display:flex; flex-wrap:wrap; gap:7px; }
.jar-empty { font-size:0.82rem; color:var(--muted); font-style:italic; }
.jar-tag {
  display:inline-flex; align-items:center; gap:6px;
  background:white; border:1px solid color-mix(in srgb, var(--peach) 40%, white);
  color:#c87850; padding:5px 6px 5px 13px; border-radius:50px;
  font-size:0.8rem; font-weight:600; line-height:1.4;
  box-shadow:0 2px 8px rgba(240,160,122,0.12);
}
.jar-tag.new { animation:popIn 0.5s var(--spring); }
.jar-tag.leaving { animation:popOut 0.25s ease both; }
.jar-del {
  background:none; border:none; color:#c87850; cursor:pointer;
  font-size:0.75rem; line-height:1; width:22px; height:22px; border-radius:50%;
  transition:background 0.2s, color 0.2s;
}
.jar-del:hover { background:var(--peach); color:white; }
@keyframes popIn  { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes popOut { to{transform:scale(0.5);opacity:0} }

/* ---- AFFIRMATION ---- */
.aff-box {
  background:var(--lavender-pale);
  border-radius:20px; padding:20px 18px; margin-top:16px;
  font-family:'Playfair Display',serif; font-style:italic;
  font-size:1.08rem; color:var(--text); text-align:center; line-height:1.7;
  display:none;
}
.aff-box.show { display:block; animation:fadeUp 0.5s var(--smooth); }
.aff-btn {
  display:block; width:100%; margin-top:14px;
  padding:12px; background:linear-gradient(135deg, var(--lavender), #c0a8e8); color:white;
  border:none; border-radius:50px; font-family:'Quicksand',sans-serif;
  font-size:0.88rem; font-weight:700; cursor:pointer;
  transition:transform 0.3s var(--spring), box-shadow 0.3s;
  box-shadow:0 6px 18px rgba(168,144,216,0.35);
}
.aff-btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(168,144,216,0.45); }
.aff-btn:active { transform:scale(0.97); }

/* ---- HEART BURST ---- */
.burst {
  position:fixed; z-index:900; pointer-events:none;
  font-size:var(--s,16px);
  animation: burst 1s var(--smooth) forwards;
}
@keyframes burst {
  0%   { transform:translate(-50%,-50%) scale(0.2); opacity:1; }
  70%  { opacity:1; }
  100% { transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(var(--r)); opacity:0; }
}

/* ---- TOAST ---- */
.toast {
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translate(-50%, 30px); opacity:0;
  background:var(--text); color:white;
  padding:11px 20px; border-radius:50px;
  font-size:0.84rem; font-weight:600; white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  z-index:950; pointer-events:none;
  transition:opacity 0.35s, transform 0.45s var(--spring);
}
.toast.show { opacity:1; transform:translate(-50%, 0); }

/* ---- WIDER SCREENS ---- */
@media (min-width: 640px) {
  #modal-overlay { align-items:center; padding:24px; }
  .modal { border-radius:30px; padding-top:30px; }
  .modal-handle { display:none; }
  @keyframes sheetIn  { from{transform:translateY(40px) scale(0.94);opacity:0} to{transform:none;opacity:1} }
  @keyframes sheetOut { to{transform:translateY(20px) scale(0.96);opacity:0} }
  .shelf { gap:16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:0.01ms !important; animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
  .float-heart { display:none; }
}
</style>
</head>

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- Storage (safe if unavailable) ----
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}
const seen = new Set(load('botiquin-seen', []));

// ---- Ambient floating hearts ----
function spawnHearts() {
  if (reduceMotion) return;
  const wrap = document.getElementById('hearts');
  const glyphs = ['🩷','♡','✦','🤍','✧'];
  for (let i = 0; i < 14; i++) {
    const h = document.createElement('span');
    h.className = 'float-heart';
    h.textContent = glyphs[i % glyphs.length];
    h.style.left = (Math.random()*100) + '%';
    h.style.setProperty('--size', (10 + Math.random()*12) + 'px');
    h.style.setProperty('--dur', (12 + Math.random()*12) + 's');
    h.style.setProperty('--delay', (-Math.random()*20) + 's');
    h.style.setProperty('--sway', (Math.random()*60 - 30) + 'px');
    h.style.setProperty('--op', (0.2 + Math.random()*0.25).toFixed(2));
    h.style.color = 'var(--pink-light)';
    wrap.appendChild(h);
  }
}

// ---- Heart burst ----
function burst(x, y, count = 12, glyphs = ['🩷','💕','✨','💗','🤍']) {
  if (reduceMotion) return;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.className = 'burst';
    s.textContent = glyphs[i % glyphs.length];
    const angle = (Math.PI*2*i)/count + Math.random()*0.5;
    const dist = 50 + Math.random()*60;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.setProperty('--x', Math.cos(angle)*dist + 'px');
    s.style.setProperty('--y', Math.sin(angle)*dist - 20 + 'px');
    s.style.setProperty('--r', (Math.random()*80 - 40) + 'deg');
    s.style.setProperty('--s', (12 + Math.random()*10) + 'px');
    s.addEventListener('animationend', () => s.remove());
    document.body.appendChild(s);
  }
}
function centerOf(el) {
  const r = el.getBoundingClientRect();
  return [r.left + r.width/2, r.top + r.height/2];
}

// ---- Toast ----
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function updateProgress() {
  const n = remedies.filter((_, i) => seen.has(i)).length;
  document.getElementById('progress-fill').style.width = (n / remedies.length * 100) + '%';
  document.getElementById('progress-note').textContent =
    n === remedies.length ? 'Ya abriste todos los remedios 🩷 vuelve a ellos cuando quieras'
                          : `Has abierto ${n} de ${remedies.length} remedios`;
}

// ---- Build shelf ----
function buildShelf() {
  const shelf = document.getElementById('shelf');
  if (shelf.children.length) return;
  remedies.forEach((r, i) => {
    const div = document.createElement('button');
    div.type = 'button';
    div.className = 'remedy' + (seen.has(i) ? '' : ' unseen');
    div.style.setProperty('--item-color', r.color);
    div.style.animationDelay = (0.35 + i*0.07)+'s';
    div.innerHTML = `
      <span class="glow"></span>
      <span class="shine"></span>
      <span class="dot"></span>
      <span class="remedy-icon">${r.icon}</span>
      <div class="remedy-label">${r.label}</div>
      <div class="remedy-name">${r.name}</div>
      <span class="remedy-badge">${r.badge}</span>
    `;
    div.onclick = () => openRemedy(i, div);
    shelf.appendChild(div);
  });
  updateProgress();
}

function openRandom() {
  const unseen = remedies.map((_, i) => i).filter(i => !seen.has(i));
  const pool = unseen.length ? unseen : remedies.map((_, i) => i);
  const i = pool[Math.floor(Math.random()*pool.length)];
  const card = document.querySelectorAll('.remedy')[i];
  card.scrollIntoView({ block:'center', behavior: reduceMotion ? 'auto' : 'smooth' });
  setTimeout(() => openRemedy(i, card), reduceMotion ? 0 : 350);
}

let lastFocus = null;
let closeTimer = null;
function openRemedy(i, el) {
  const r = remedies[i];
  clearTimeout(closeTimer);
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('closing', 'show');
  document.querySelectorAll('.remedy').forEach(x=>x.classList.remove('opened'));
  el.classList.add('opened');
  document.getElementById('m-icon').textContent = r.icon;
  document.getElementById('m-tag').textContent = r.tag;
  document.getElementById('m-title').textContent = r.name;
  document.getElementById('m-body').innerHTML = r.content;
  document.getElementById('modal').style.setProperty('--modal-color', r.color);
  stopBreath();
  if (r.isJar) renderJar();

  const firstTime = !seen.has(i);
  seen.add(i);
  save('botiquin-seen', [...seen]);
  el.classList.remove('unseen');
  updateProgress();

  lastFocus = el;
  void overlay.offsetWidth; // restart animations
  overlay.classList.add('show');
  document.body.classList.add('modal-open');
  document.getElementById('modal').scrollTop = 0;
  document.querySelector('.modal-close').focus({ preventScroll:true });

  if (firstTime && seen.size === remedies.length) {
    setTimeout(() => {
      burst(window.innerWidth/2, window.innerHeight/3, 24);
      toast('Abriste todo el botiquín 🩷');
    }, 600);
  }
}

function closeModal(e) {
  if(e.target===document.getElementById('modal-overlay')) closeModalBtn();
}
function closeModalBtn() {
  const overlay = document.getElementById('modal-overlay');
  if (!overlay.classList.contains('show') || overlay.classList.contains('closing')) return;
  stopBreath();
  overlay.classList.add('closing');
  document.body.classList.remove('modal-open');
  closeTimer = setTimeout(() => overlay.classList.remove('show', 'closing'), reduceMotion ? 0 : 300);
  if (lastFocus) lastFocus.focus({ preventScroll:true });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalBtn();
});

// ---- BREATHING ----
let bTimer = null;
const bPhases = [
  {text:'Inhala...', dur:4, scale:1.7},
  {text:'Aguanta...', dur:4, scale:1.7},
  {text:'Exhala...', dur:6, scale:1.0},
];
function startBreath() {
  stopBreath();
  runPhase(0, 0);
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch(e) {} }
function runPhase(pi, tick) {
  const ring = document.getElementById('b-ring');
  const halo = document.getElementById('b-halo');
  const phase = document.getElementById('b-phase');
  const fill = document.getElementById('b-fill');
  if(!ring) return;
  const p = bPhases[pi%3];
  const total = p.dur*10;
  if(tick===0) {
    phase.textContent = p.text;
    phase.classList.remove('swap'); void phase.offsetWidth; phase.classList.add('swap');
    buzz(40);
    const cycles = Math.floor(pi/3);
    document.getElementById('b-count').textContent =
      cycles ? `${cycles} ${cycles===1?'respiración':'respiraciones'} · lo estás haciendo muy bien 🌿` : '';
  }
  const prog = tick/total;
  fill.style.width = (prog*100)+'%';
  const prevScale = pi%3===0?1.0:bPhases[(pi-1)%3].scale;
  // ease in-out so the ring breathes smoothly
  const eased = prog<0.5 ? 2*prog*prog : 1-Math.pow(-2*prog+2,2)/2;
  const s = prevScale + (p.scale-prevScale)*eased;
  ring.style.transform = `scale(${s})`;
  if (halo) halo.style.transform = `scale(${s*1.35})`;
  if(tick<total) bTimer=setTimeout(()=>runPhase(pi,tick+1),100);
  else bTimer=setTimeout(()=>runPhase(pi+1,0),100);
}
function stopBreath() {
  clearTimeout(bTimer);
  const ring=document.getElementById('b-ring');
  const halo=document.getElementById('b-halo');
  const fill=document.getElementById('b-fill');
  const phase=document.getElementById('b-phase');
  const count=document.getElementById('b-count');
  if(ring){ring.style.transform='scale(1)';}
  if(halo){halo.style.transform='scale(1)';}
  if(fill){fill.style.width='0%';}
  if(phase){phase.textContent='Presiona para empezar';}
  if(count){count.textContent='';}
}

// ---- JAR ----
const jarItems = load('botiquin-jar', []);
function renderJar(newIndex = -1) {
  const tags = document.getElementById('jar-tags');
  if(!tags) return;
  tags.innerHTML = '';
  if(!jarItems.length) {
    tags.innerHTML = '<span class="jar-empty">Tu frasco está vacío... por ahora 🫙</span>';
    return;
  }
  jarItems.forEach((val, i) => {
    const tag = document.createElement('div');
    tag.className = 'jar-tag' + (i === newIndex ? ' new' : '');
    const txt = document.createElement('span');
    txt.textContent = '✦ ' + val;
    const del = document.createElement('button');
    del.className = 'jar-del';
    del.textContent = '✕';
    del.setAttribute('aria-label', 'Quitar');
    del.onclick = () => {
      tag.classList.add('leaving');
      setTimeout(() => { jarItems.splice(i, 1); save('botiquin-jar', jarItems); renderJar(); }, reduceMotion ? 0 : 250);
    };
    tag.append(txt, del);
    tags.appendChild(tag);
  });
}
function addJar() {
  const inp = document.getElementById('jar-inp');
  const val = inp?.value.trim();
  if(!val) return;
  jarItems.push(val);
  save('botiquin-jar', jarItems);
  inp.value = '';
  renderJar(jarItems.length - 1);
  const btn = document.querySelector('.jar-save');
  if (btn) burst(...centerOf(btn), 10, ['✦','🧡','✨','💛']);
  toast('Guardado en tu frasco ✦');
}

// ---- GREETING ----
function greeting() {
  const h = new Date().getHours();
  if (h < 6)  return 'Es tarde, mi Piuchi... aquí estoy 🌙';
  if (h < 12) return 'Buenos días, mi Piuchi ☀️';
  if (h < 19) return 'Buenas tardes, mi Piuchi 🌤️';
  return 'Buenas noches, mi Piuchi 🌙';
}

  const btn = document.getElementById('open-btn');
  btn.disabled = true;
  burst(...centerOf(btn), 16);
  setTimeout(() => document.getElementById('intro').classList.add('out'), reduceMotion ? 0 : 250);

    const m=document.getElementById('main');
    m.style.display='block';
    document.getElementById('greeting').textContent = greeting();
    buildShelf();
    requestAnimationFrame(() => m.classList.add('show'));
  }, reduceMotion ? 0 : 900);
}
